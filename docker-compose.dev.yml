services:
  backend-fastify:
    build:
      context: .
      dockerfile: backend-fastify/Dockerfile.dev
    container_name: manga-backend-dev
    ports:
      - '3022:3022'
    env_file:
      - backend-fastify/.env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend-fastify/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    working_dir: /app/backend-fastify
    command: sh -c "pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm dev"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: manga-frontend-dev
    env_file:
      - frontend/.env
    ports:
      - '3011:3011'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend-fastify
    working_dir: /app/frontend
    command: pnpm dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=100

  redis:
    image: redis:7-alpine
    container_name: manga-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass $REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: $REDIS_PASSWORD
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: manga-postgres-dev
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
