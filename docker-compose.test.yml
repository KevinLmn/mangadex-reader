services:
  postgres-test:
    image: postgres:16-alpine
    container_name: manga-postgres-test
    environment:
      POSTGRES_USER: kevin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manga_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kevin -d manga_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
